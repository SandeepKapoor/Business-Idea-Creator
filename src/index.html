<!--
  THESIS: The 114 ideas are specimens in a working type foundry's own ledger, not rows in a
  dashboard. Every idea is a numbered plate you judge by seeing it set at scale — the way a real
  specimen book proves a face by showing it work, never by a swatch.
  OWN-WORLD: Ivory book stock (#F7F1E4) and near-black foundry ink (#1A1712) on both sides, never
  neutral grey. One accent — foundry oxblood #8A2A1F — reserved entirely for "this is live or
  selected," the way a proof-stamp marks a correction on a specimen sheet; it never decorates
  chrome. Fraunces (self-hosted, base64-inlined, variable) carries every display plate at genuine
  specimen scale; platform mono carries every technical annotation — x-height and cap-height
  swapped for this document's own measured/judged/guessed. Square corners, hairline rules, flat
  ink on stock, no shadows, no gradients.
  STORY: He opens a numbered plate the way a type director opens a specimen book — the idea set
  large enough to judge on sight — and reads its technical annotation beside it: which axis it
  measures, which score is counted versus judged, exactly as a specimen states its cut and weight.
  FIRST VIEWPORT: A title plate — "Business idea map" at genuine display scale, deck beneath it,
  five findings as a ruled annotation row — over the first numbered plate already open, with the
  four modes as a foundry catalogue's own index strip above.
  ONE DEVICE FOR "LIVE": an oxblood rule down the left edge of the open plate, the selected route,
  the active index entry. Never a four-sided accent box — the accent marks a specimen in use,
  never the shelf it sits on.
  FORM: Foundry Specimen Ledger. Rolled 6 Aug 2026 against a grounded list drawn from the
  editorial/strategic-design world (the consulting exhibit deck, the patent-drawing archive, the
  provenance-label system, the architectural competition board, the natural-history catalog),
  weighed against the roll's strongest challenger (an origami-fold sequence, which loses on
  product clarity — no native answer for 114 discrete items or dense tables) and confirmed. It
  replaces Vermillion Broadsheet, which was correct for a newsprint-style report and, at this
  document's actual density — 114 numbered items, ten score columns, four axes — read as argument
  rather than as the specimen catalogue this bank of ideas actually is.
  DEVIATIONS, DECLARED: (1) PRODUCT.md forbade every external resource including fonts; revised
  6 Aug 2026 to permit exactly one self-hosted, base64-inlined display face, because no installed
  system serif reads as a foundry face worth showcasing and the specimen thesis depends on one.
  Body, UI, and tabular text stay on system stacks. (2) Cream-plus-serif is the category's most
  common AI-rendered look; pushed toward a real foundry's own material register (ivory stock, not
  parchment; a working grotesque's technical annotation, not lamplight) rather than its softest,
  most generic rendition.
  ACCESSIBILITY, NOT NEGOTIABLE: no meaning rides on hue. Every verdict keeps its word, every
  gate keeps its strike, every axis keeps its index. Oxblood-versus-ink does the work colour alone
  never gets to do.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
