<!-- ============ ICON SET ============
     craft-floor: "Unicode glyphs or emoji standing in for an icon system. Icons are drawn, from
     a real library or authored SVG, in one consistent stroke and weight." The page previously
     used ▶ ▼ ◀ ⓘ ★ ✓ ✕ ⚡ ⟳ ▸ ● — eleven different typefaces' idea of an icon, at eleven
     different optical weights, none of which matched Inter.

     These are authored on a 16-unit grid, 1.5 stroke, round caps and joins, no fills except
     where a shape is genuinely solid. One sprite, referenced with <use>, so the artifact stays
     self-contained: a fragment href is not a remote url() and tools/verify.js is satisfied.

     currentColor throughout, so an icon takes the colour of whatever it sits in. -->
<svg width="0" height="0" aria-hidden="true" focusable="false"
     style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <g id="ic" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>

  <symbol id="i-chevron" viewBox="0 0 16 16"><!-- points right; rotated for open -->
    <path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.75"
          stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <symbol id="i-arrow-left" viewBox="0 0 16 16">
    <path d="M12.5 8h-9m0 0L7 4.5M3.5 8 7 11.5" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>


  <symbol id="i-bolt" viewBox="0 0 16 16"><!-- build it -->
    <path d="M8.75 1.5 3.5 9h3.75l-.5 5.5L12.5 7H8.75z" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <symbol id="i-shuffle" viewBox="0 0 16 16"><!-- surprise me -->
    <path d="M1.75 4h2.1a3 3 0 0 1 2.45 1.27l3.4 4.96A3 3 0 0 0 12.15 11.5h2.1M1.75 12h2.1a3 3 0 0 0 2.45-1.27l.62-.9M9.3 5.67l.4-.58A3 3 0 0 1 12.15 3.8h2.1"
          fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12.4 1.9 14.4 3.8l-2 1.9M12.4 9.6l2 1.9-2 1.9" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <symbol id="i-info" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M8 7.25v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="8" cy="4.9" r=".85" fill="currentColor"/></symbol>

  <symbol id="i-check" viewBox="0 0 16 16">
    <path d="M3 8.4 6.3 11.7 13 5" fill="none" stroke="currentColor" stroke-width="1.75"
          stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <symbol id="i-x" viewBox="0 0 16 16">
    <path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round"/></symbol>

  <symbol id="i-alert" viewBox="0 0 16 16">
    <path d="M8 1.9 15 14H1z" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linejoin="round"/>
    <path d="M8 6.3v3.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="8" cy="11.7" r=".85" fill="currentColor"/></symbol>




  <symbol id="i-doc" viewBox="0 0 16 16"><!-- the report -->
    <path d="M9 1.75H4.25a1.5 1.5 0 0 0-1.5 1.5v9.5a1.5 1.5 0 0 0 1.5 1.5h7.5a1.5 1.5 0 0 0 1.5-1.5V6z"
          fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M9 1.75V6h4.25M5.5 9h5M5.5 11.5h3.5" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <symbol id="i-sliders" viewBox="0 0 16 16"><!-- the workspace: four axes to set -->
    <path d="M2 4.5h3.5M8.5 4.5H14M2 11.5h6M11 11.5h3" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="7" cy="4.5" r="1.75" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="9.5" cy="11.5" r="1.75" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>

  <symbol id="i-scale" viewBox="0 0 16 16"><!-- the evidence ledger -->
    <path d="M8 2.25v11.5M4.25 13.75h7.5M2 6.25h12M8 2.25 2 6.25M8 2.25l6 4"
          fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M2 6.25 .5 10.25h3zM14 6.25l-1.5 4h3z" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linejoin="round"/></symbol>

  <symbol id="i-contrast" viewBox="0 0 16 16"><!-- light / dark -->
    <circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></symbol>

  <symbol id="i-collapse" viewBox="0 0 16 16"><!-- fold everything up -->
    <path d="M4.5 6.5 8 3l3.5 3.5M4.5 13 8 9.5l3.5 3.5" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <symbol id="i-expand" viewBox="0 0 16 16"><!-- unfold everything -->
    <path d="M4.5 3 8 6.5 11.5 3M4.5 9.5 8 13l3.5-3.5" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <symbol id="i-search" viewBox="0 0 16 16"><!-- find anything on the page -->
    <circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M10.4 10.4 14 14" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round"/></symbol>
</svg>
