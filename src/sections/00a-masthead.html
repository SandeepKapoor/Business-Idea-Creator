<!-- ============ MASTHEAD ============
     The report used to open on eleven folded headings — a table of contents, which tells you the
     document exists and nothing about what it does. This opens on findings instead: the five
     counts that matter, as a ruled table rather than a picture of the document's own data (see
     01a-field.css) — a report opens by saying what it found, not with an illustration of itself.

     Every figure here is computed at boot from the same engine that scores the bank, so the
     masthead cannot drift from the document. Filled by 22-mast.js.

     It carries class="sec" so mode() hides it outside the report, and it deliberately has no h2 —
     initFold() only folds sections with one, and a masthead that can be collapsed is furniture. -->
<div class="sec mast" id="mast">
  <h1>Business idea map</h1>

  <div class="mastspin" id="mastSpin">
    <div class="spintext" id="mastSpinText" aria-live="polite"></div>
    <button type="button" class="mastnext" id="mastNext" onclick="spinMast()" aria-label="Show another idea">
      <svg class="i" aria-hidden="true"><use href="#i-chevron"/></svg>
    </button>
  </div>
</div>
