<!-- ============ IDEA BANK ============ -->
<div class="sec" id="bank">
  <h2>4 · The idea bank</h2>
  <h3>114 ideas · 12 clusters · continuously numbered</h3>
  <div class="legendrow" id="legendRow"></div>
  <div class="filters">
    <span class="flabel">Family</span><span id="famFilters"></span>
    <span class="flabel" style="margin-left:10px">Lens</span>
    <button class="chip" data-lens="pay">Someone else pays</button>
    <button class="chip" data-lens="np">You're not the product</button>
    <button class="chip" data-lens="fast">Cash in &lt;30 days</button>
    <button class="chip" id="expAll" style="margin-left:var(--sp-3)">
      <svg class="i i-xs" aria-hidden="true"><use href="#i-expand"/></svg> expand all</button>
    <button class="chip" id="colAll">
      <svg class="i i-xs" aria-hidden="true"><use href="#i-collapse"/></svg> collapse all</button>
    <span class="count" id="cnt"></span>
  </div>
  <div id="bankBody"></div>
</div>
