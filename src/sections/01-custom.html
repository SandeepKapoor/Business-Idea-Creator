<!-- ============ THE WORKSPACE ============
     Two ways in, and only ever one on screen. Both set the same four axes: pick a bank idea and
     its axes load behind the scenes, or set them yourself. Showing both at once invited the
     question "which one is it actually using?", which has no good answer. -->
<div class="sec" id="custom" hidden>
  <h2>Workspace</h2>
  <h3>Start from one of the 114 ideas, or build a combination yourself.</h3>
  <div class="card">
    <div class="wseg">
      <button class="wtab on" id="wtabBank" type="button" onclick="pickMode('bank')">
        Start from an idea</button>
      <button class="wtab" id="wtabAxes" type="button" onclick="pickMode('axes')">
        Build my own combination</button>
    </div>

    <div id="wBank">
      <div class="bldbar" style="margin-top:0">
        <div class="fld" style="flex:1;min-width:250px;max-width:460px">
          <label for="dSel">One of the 114 ideas</label>
          <select id="dSel" onchange="openInBuilder(+this.value)"></select></div>
        <button class="rollbtn" onclick="openInBuilder(+document.getElementById('dSel').value)"><svg class="i" aria-hidden="true"><use href="#i-bolt"/></svg> Build it</button>
      </div>
    </div>

    <div id="wAxes" hidden>
      <!-- The same four-column picker as the report's engine, not four dropdowns. A <select>
           hides nineteen of twenty options behind a click, which is precisely the space this
           page exists to let you see. Filled by buildPicker() in 02-axes.js. -->
      <div id="wPick"></div>
      <div class="bldbar">
        <button class="rollbtn" onclick="gen()"><svg class="i" aria-hidden="true"><use href="#i-bolt"/></svg> Build it</button>
        <button class="rollbtn ghost" onclick="surprise()"><svg class="i" aria-hidden="true"><use href="#i-shuffle"/></svg> Surprise me</button>
      </div>
    </div>

    <div class="bldsplit"></div>
    <div class="bldbar" style="margin-top:0">
      <div class="fld" style="min-width:170px"><label for="tgt">Monthly income target ₹</label>
        <input type="number" id="tgt" value="250000" step="25000" min="25000"
               onchange="if(LAST)gen(1)"></div>
    </div>
  </div>
  <div id="cOut"><div class="empty">Pick one of the 114 ideas and hit
    <b style="color:var(--ink-1)">Build it</b> — or switch to
    <b style="color:var(--ink-1)">Build my own combination</b> and pick the four axes yourself.</div></div>
</div>
