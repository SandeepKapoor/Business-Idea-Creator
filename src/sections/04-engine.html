<!-- ============ ENGINE ============ -->
<div class="sec" id="engine">
  <h2>2 · The engine</h2>
  <h3>WHO × OUTCOME × HOW × MONEY — click any cell, or hit Roll</h3>
  <!-- Filled by buildPicker() in 02-axes.js — the same component the workspace uses. -->
  <div id="engPick"></div>
  <div class="combo">
    <div class="txt" id="comboTxt"></div>
    <button class="rollbtn" onclick="roll()"><svg class="i" aria-hidden="true"><use href="#i-shuffle"/></svg> Roll</button>
    <button class="rollbtn ghost" onclick="roll(true)">Roll 5 →&nbsp;log</button>
  </div>
  <div id="rollLog" class="grid" style="margin-top:10px"></div>
  <p class="tiny" style="margin-top:12px">Rule of use: roll 20 times in a sitting, write down every
  combination that makes you feel slightly uncomfortable, and throw away the ones that feel obviously
  good — those are the clichés everyone else already built.</p>
</div>
